<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>APC Interview Assistant</title>
  <meta name="description" content="Live RICS APC interview assistant: hears the assessors, detects questions and shows answers from your competency library and case study." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234c6ef5'/%3E%3Cpath d='M16 8v16M11 12v8M21 12v8M6 15v2M26 15v2' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Apply the saved theme before the first paint (no flash of the wrong theme)
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('tma_theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
